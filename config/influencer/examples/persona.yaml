# The Persona_Example (design §M1; Req 4.1, 26.12): a fictional persona, aged 29, with every Persona_File
# field given a value. To start a persona, copy this file to <Influencer home>/<slug>/persona.yaml and
# change every value. Image, LUT and shot paths are relative to that folder, the Influencer_Root, and LoRA
# paths to models/loras. None of the files named here exist in the repo; the Persona_Reader checks that
# the hero image, the Reference_Pack and the LUT exist when it loads a real Persona_File (Req 4.7).
version: 1
